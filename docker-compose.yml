services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicaqr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d clinicaqr"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      URL_BANCO: jdbc:postgresql://banco:5432/clinicaqr
      USUARIO_BANCO: postgres
      SENHA_BANCO: postgres
      CHAVE_JWT: altere-esta-chave-secreta-com-mais-de-32-caracteres
      URL_PUBLICA: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      banco:
        condition: service_healthy
  interface:
    build:
      context: ./frontend
      args:
        VITE_URL_API: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  postgres_data:
