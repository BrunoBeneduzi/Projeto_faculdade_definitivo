services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinicaqr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d clinicaqr"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clinicaqr
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: altere-esta-chave-secreta-com-mais-de-32-caracteres
      PUBLIC_BASE_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:
