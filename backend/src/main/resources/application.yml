spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinicaqr}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-minimo-32-caracteres}
    expiration-ms: 86400000
